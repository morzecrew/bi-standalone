# yaml-language-server: $schema=https://morzecrew.github.io/morzer/schemas/selfhost-v1alpha1-secrets.json
#
# Every secret reaches its services as a 0400 file, so a service that does not
# run as root reads one only when `owner` gives it the file. The backend,
# worker, bootstrap and seed run as 65532; postgres and flyway start as root and
# read any file.
#
# `init` generates every secret but one, and one value has one declaration: the
# readers of a value share the one declaration that holds it. `admin_password`
# is the only secret without a generator, which the operator sets.
#
# `services` is what a rotation restarts. The one-shots, flyway, bootstrap and
# seed, read their files afresh on every run and are never listed.
api_version: selfhost/v1alpha1

secrets:
  - name: postgres_password
    description: Password of the postgres role, read by postgres and the backend
    required: true
    generator:
      kind: password
      length: 32
    owner: "65532"
    services: [postgres, backend, worker]

  - name: access_secret_key
    description: Key the backend signs access tokens with
    required: true
    generator:
      kind: base64
      length: 32
    owner: "65532"
    services: [backend, worker]
    rotation_period: 2160h

  - name: refresh_pepper
    description: Pepper the backend hashes refresh tokens with
    required: true
    generator:
      kind: base64
      length: 32
    owner: "65532"
    services: [backend, worker]
    rotation_period: 2160h

  # Placeholders until the operator sets the real values: Compose starts no
  # service whose secret file is missing, and only `init` generates.
  - name: llm_api_key
    description: Key of the model endpoint (llm_base_url), a placeholder until the operator sets it
    required: true
    generator:
      kind: password
      length: 32
    owner: "65532"
    services: [backend, worker]

  - name: telegram_bot_token
    description: The Telegram bot's token from @BotFather, a placeholder until the operator sets it and turns telegram_enabled on
    required: true
    generator:
      kind: password
      length: 32
    owner: "65532"
    services: [backend, worker]

  - name: admin_password
    description: Password bootstrap gives the first administrator
    required: true
    owner: "65532"
